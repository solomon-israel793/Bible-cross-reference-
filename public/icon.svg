<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="arc1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="arc2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="arc3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Rainbow Cross-Reference Arcs -->
  <path d="M 80 400 C 80 180, 432 180, 432 400" fill="none" stroke="url(#arc1)" stroke-width="12" stroke-linecap="round" opacity="0.9" />
  <path d="M 120 400 C 120 230, 392 230, 392 400" fill="none" stroke="url(#arc3)" stroke-width="10" stroke-linecap="round" opacity="0.85" />
  <path d="M 160 400 C 160 280, 352 280, 352 400" fill="none" stroke="url(#arc2)" stroke-width="8" stroke-linecap="round" opacity="0.8" />

  <!-- Canonical Baseline Ticks -->
  <line x1="80" y1="400" x2="432" y2="400" stroke="#52525b" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="400" x2="120" y2="416" stroke="#a1a1aa" stroke-width="3"/>
  <line x1="160" y1="400" x2="160" y2="412" stroke="#a1a1aa" stroke-width="3"/>
  <line x1="200" y1="400" x2="200" y2="420" stroke="#f59e0b" stroke-width="3"/>
  <line x1="256" y1="400" x2="256" y2="424" stroke="#e4e4e7" stroke-width="4"/>
  <line x1="312" y1="400" x2="312" y2="414" stroke="#a1a1aa" stroke-width="3"/>
  <line x1="360" y1="400" x2="360" y2="418" stroke="#a1a1aa" stroke-width="3"/>
  <line x1="392" y1="400" x2="392" y2="412" stroke="#a1a1aa" stroke-width="3"/>

  <!-- Central Radiant Cross -->
  <g filter="url(#glow)">
    <!-- Vertical Cross Beam -->
    <rect x="238" y="140" width="36" height="210" rx="8" fill="url(#goldGrad)" />
    <!-- Horizontal Cross Beam -->
    <rect x="176" y="196" width="160" height="36" rx="8" fill="url(#goldGrad)" />
  </g>

  <!-- Cross Center Highlight Sparkle -->
  <circle cx="256" cy="214" r="6" fill="#ffffff" opacity="0.9" />
</svg>
