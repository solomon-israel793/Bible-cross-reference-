    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="Comprehensive Bible reader featuring the iconic 63,779 cross-reference arc visualization, authentic scripture text, deep verse study accordions, and personal notes." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScriptureArc" />
    <meta name="application-name" content="ScriptureArc" />
    <meta name="msapplication-TileColor" content="#121212" />

    <!-- OpenGraph & Twitter Social Cards -->
    <meta property="og:title" content="ScriptureArc - Bible Cross-Reference & Study" />
    <meta property="og:description" content="Comprehensive Bible reader featuring the iconic 63,779 cross-reference arc visualization, authentic scripture text, deep verse study accordions, and personal notes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/screenshots/screenshot-desktop.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Manifest & Icons for PWABuilder -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

    <!-- Dev Sandbox & Service Worker Management -->
    <script>
      (function() {
        // Suppress harmless Vite HMR WebSocket disconnect noise in sandbox iFrames
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = (arg && (arg.stack || arg.message)) ? (arg.stack || arg.message) : String(arg);
            if (str && (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1 || str.indexOf('vite-hmr') !== -1)) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (event && (
            (event.message && event.message.indexOf('WebSocket') !== -1) ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1) ||
            (event.error && (event.error.message || '').indexOf('WebSocket') !== -1)
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.stack || reason.message)) ? (reason.stack || reason.message) : String(reason);
          if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('ScriptureArc PWA Service Worker active:', reg.scope);
            })
            .catch(function(err) {
              console.log('PWA Service Worker registration:', err);
            });
        });
      }
    </script>
  </head>
  <body class="bg-[#121212] text-zinc-100 antialiased selection:bg-amber-500/30 selection:text-amber-200 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
