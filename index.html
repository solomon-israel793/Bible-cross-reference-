<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ScriptureArc - Bible Cross-Reference</title>
    <meta name="description" content="YouVersion-inspired Bible reader featuring 63,779 scripture cross-reference arcs, KJV and NIV translations, and deep verse study mode." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScriptureArc" />
    <meta name="application-name" content="ScriptureArc" />
    <meta name="msapplication-TileColor" content="#121212" />

    <!-- OpenGraph & Twitter Social Cards -->
    <meta property="og:title" content="ScriptureArc - Bible Cross-Reference" />
    <meta property="og:description" content="YouVersion-inspired Bible reader featuring 63,779 scripture cross-reference arcs, KJV and NIV translations, and deep verse study mode." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/screenshots/screenshot-desktop.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Manifest & Icons for PWABuilder -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

    <!-- Explicit Service Worker Registration for PWABuilder Crawler -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('ScriptureArc PWA Service Worker active:', reg.scope);
            })
            .catch(function(err) {
              console.log('PWA Service Worker registration:', err);
            });
        });
      }
    </script>
  </head>
  <body class="bg-[#121212] text-zinc-100 antialiased selection:bg-amber-500/30 selection:text-amber-200 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
